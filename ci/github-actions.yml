name: Repository checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      MPLCONFIGDIR: ${{ github.workspace }}/.local/cache/matplotlib
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            envs/cpu-py312.lock.txt
            dependencies.lock.json
      - name: Link pinned ACT source
        run: python scripts/bootstrap_dependencies.py --dependency lerobot --fetch --shared-root "$RUNNER_TEMP/tactile-deps"
      - name: Install CPU environment
        run: |
          python -m pip install torch==2.9.1 torchvision==0.24.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r envs/cpu-py312.lock.txt
          python -m pip install --no-deps --no-build-isolation -e '.[train,report,dev]' -e external/lerobot
          python -m pip check
      - name: Verify active ACT dependency
        run: python scripts/doctor.py --profile train
      - name: Run synthetic and CPU regression tests
        run: python -m pytest tests -q
      - name: Build portal shell without experiment data
        run: |
          python -m portal_host.build_site
          python -m portal_host.deploy --build-only --source .local/deploy/site-preview
      - name: Check tracked source boundaries
        run: python scripts/check_repository.py
      - name: Check source tree remains clean
        run: |
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
